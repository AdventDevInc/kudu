name: Release - Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A newer run must never interrupt signing or publication of this tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    uses: ./.github/workflows/ci.yml

  package-smoke:
    name: Verify Packaging
    uses: ./.github/workflows/package-smoke.yml

  create-release:
    name: Prepare Draft Release
    needs: [validate, package-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag and prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/prepare-release.js

  build:
    name: Build and Sign (${{ matrix.os }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-args: --win
          - os: macos-latest
            build-args: --mac
          # Arch flags keep each Linux runner on its native CPU — building both
          # arches on one host breaks better-sqlite3 / yara native rebuilds.
          - os: ubuntu-latest
            build-args: --linux --x64
          - os: ubuntu-24.04-arm
            build-args: --linux --arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Azure login (Windows signing)
        if: runner.os == 'Windows'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Package and sign without publishing
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          DEBUG: ${{ runner.os == 'macOS' && 'electron-notarize*' || '' }}
        timeout-minutes: 30
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx electron-builder ${{ matrix.build-args }} --publish never \
              -c.win.azureSignOptions.endpoint="https://eus.codesigning.azure.net" \
              -c.win.azureSignOptions.codeSigningAccountName="kudu-signing" \
              -c.win.azureSignOptions.certificateProfileName="kudu-sign" \
              -c.win.azureSignOptions.publisherName="Advent Development, Inc."
          else
            npx electron-builder ${{ matrix.build-args }} --publish never
          fi

      - name: Store release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish-release:
    name: Verify and Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install verification dependencies
        run: npm ci --ignore-scripts
      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release-artifacts
          # Keep platform directories separate so duplicate filenames fail
          # verification instead of silently overwriting another architecture.
          merge-multiple: false
      - name: Verify artifacts and manifests, upload, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/publish-release.js release-artifacts

  deploy-website:
    name: Deploy Website
    needs: publish-release
    uses: ./.github/workflows/deploy-website.yml
    secrets:
      WEB_DEPLOY_HOOK: ${{ secrets.WEB_DEPLOY_HOOK }}

  publish-choco:
    name: Publish Chocolatey Package
    needs: publish-release
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download installer and compute checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/AdventDevInc/kudu/releases/download/v$version/Kudu-Setup-$version.exe"
          Invoke-WebRequest -Uri $url -OutFile "Kudu-Setup-$version.exe"
          $hash = (Get-FileHash "Kudu-Setup-$version.exe" -Algorithm SHA256).Hash
          echo "CHECKSUM=$hash" >> $env:GITHUB_ENV

      - name: Update choco package files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $nuspec = Get-Content choco/kudu.nuspec -Raw
          $nuspec = $nuspec -replace '<version>.+?</version>', "<version>$version</version>"
          $nuspec = $nuspec -replace 'tag/v.+?"', "tag/v$version`""
          Set-Content choco/kudu.nuspec $nuspec

          $install = Get-Content choco/tools/chocolateyinstall.ps1 -Raw
          $install = $install -replace "\`$version = '.+?'", "`$version = '$version'"
          $install = $install -replace '__REPLACE_WITH_SHA256_HASH__|[A-Fa-f0-9]{64}', $env:CHECKSUM
          Set-Content choco/tools/chocolateyinstall.ps1 $install

      - name: Pack and push to Chocolatey
        shell: pwsh
        run: |
          choco pack choco/kudu.nuspec --out .
          choco push usekudu.${{ steps.version.outputs.version }}.nupkg --source "https://push.chocolatey.org/" --api-key "${{ secrets.CHOCOLATEY_API_KEY }}"

  virustotal-scan:
    name: Submit to VirusTotal
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release download "v$version" --repo AdventDevInc/kudu --pattern "Kudu-Setup-*.exe" --pattern "Kudu-Portable-*.exe" --pattern "Kudu-*.dmg" --pattern "Kudu-*.AppImage" --pattern "Kudu-*.deb" --dir artifacts/

      - name: Scan with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          results=""
          for file in artifacts/*; do
            filename=$(basename "$file")
            filesize=$(stat -c%s "$file")
            echo "Uploading $filename ($filesize bytes) to VirusTotal..."

            if [ "$filesize" -gt 33554432 ]; then
              # Files > 32MB need the large-file upload URL
              echo "  Using large-file upload flow..."
              upload_url=$(curl -s --request GET \
                --url "https://www.virustotal.com/api/v3/files/upload_url" \
                --header "x-apikey: $VT_API_KEY" | jq -r '.data')
            else
              upload_url="https://www.virustotal.com/api/v3/files"
            fi

            response=$(curl -s --request POST \
              --url "$upload_url" \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$file")
            analysis_id=$(echo "$response" | jq -r '.data.id')
            if [ "$analysis_id" != "null" ] && [ -n "$analysis_id" ]; then
              echo "  Analysis ID: $analysis_id"
              results="$results- **$filename**: https://www.virustotal.com/gui/file-analysis/$analysis_id\n"
            else
              echo "  Failed to upload: $response"
              results="$results- **$filename**: upload failed\n"
            fi
            # VirusTotal free API rate limit: 4 requests/minute
            sleep 20
          done

          echo "## VirusTotal Scan Results" > vt_report.md
          echo "" >> vt_report.md
          echo -e "$results" >> vt_report.md

      - name: Append scan results to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          existing=$(gh release view "v$version" --repo AdventDevInc/kudu --json body -q .body)
          vt_report=$(cat vt_report.md)
          gh release edit "v$version" --repo AdventDevInc/kudu --notes "${existing}

          ${vt_report}"

  publish-winget:
    name: Submit WinGet Manifest
    needs: publish-release
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync winget-pkgs fork with upstream
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_GH_TOKEN }}
        run: |
          fork_owner=$(gh api user -q .login)
          gh repo sync "$fork_owner/winget-pkgs" --source microsoft/winget-pkgs --force

      - name: Update winget manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/AdventDevInc/kudu/releases/download/v$version/Kudu-Setup-$version.exe"
          $releaseNotesUrl = "https://github.com/AdventDevInc/kudu/releases/tag/v$version"
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe
          .\wingetcreate.exe update AdventDevelopmentInc.Kudu --submit --token "${{ secrets.WINGET_GH_TOKEN }}" --urls "$url|x64|machine" --version $version --release-notes-url $releaseNotesUrl
