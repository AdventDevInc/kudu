name: CI - PR Title

# PRs are squash-merged with the PR title as the commit message, so the title
# is what the changelog sees. Individual commits inside a PR are not linted.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR whose updated head is being validated
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  lint-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose

      - name: Lint dispatched PR title
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json title,headRefName,headRefOid,isCrossRepository > pr-title.json
          # Do not publish a passing title check for another PR/ref or an old head.
          jq -e --arg ref "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
            '.isCrossRepository == false and .headRefName == $ref and .headRefOid == $sha' pr-title.json
          jq -r '.title' pr-title.json | npx commitlint --verbose
