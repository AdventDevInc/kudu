name: Automation - Translations

on:
  pull_request:
    paths:
      - 'src/renderer/src/locales/en/**'

  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translate-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  translate:
    name: Update Translations
    # Skip PRs from forks (they won't have access to secrets)
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
    env:
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}

    steps:
      - name: Check for API key
        if: env.HAS_OPENAI_API_KEY != 'true'
        run: |
          echo "::warning::OPENAI_API_KEY secret is not set — skipping translations"

      - name: Checkout
        if: env.HAS_OPENAI_API_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: env.HAS_OPENAI_API_KEY == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Run translations
        if: env.HAS_OPENAI_API_KEY == 'true'
        # The translator only uses Node built-ins; no install scripts are needed.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/translate.js

      - name: Commit & push translations
        id: commit
        if: env.HAS_OPENAI_API_KEY == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/locales/
          if git diff --staged --quiet; then
            echo "No translation changes to commit"
          else
            git commit -m "chore: auto-update translations"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  validate-translations:
    name: Start checks for translated head
    needs: translate
    # Only PR updates need this handoff. Forks never reach this job.
    if: github.event_name == 'pull_request' && needs.translate.outputs.updated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # GITHUB_TOKEN PR synchronize events require approval. Explicit dispatches
      # can run automatically, with check suites attached to the updated head.
      # No checkout or PR-controlled code runs with this job's actions permission.
      - name: Dispatch checks
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          gh workflow run package-smoke.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH" -f pr_number="$PR_NUMBER"
