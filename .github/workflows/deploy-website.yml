name: Website - Deploy

on:
  push:
    branches: [main]
    paths: ['rules/**']
  release:
    # Handles manual releases. GITHUB_TOKEN publication does not trigger this;
    # the release workflow calls this workflow directly after verification.
    types: [published]
  workflow_call:
    secrets:
      WEB_DEPLOY_HOOK:
        required: true

permissions: {}

jobs:
  trigger-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Trigger website deployment
        env:
          WEB_DEPLOY_HOOK: ${{ secrets.WEB_DEPLOY_HOOK }}
        run: |
          test -n "$WEB_DEPLOY_HOOK"
          curl --fail-with-body --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 --request POST "$WEB_DEPLOY_HOOK"
